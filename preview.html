<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RandomLauncher 预览</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0b0c; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .phone { width: 390px; height: 844px; background: #000; border-radius: 54px; padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 2px 2px #2a2a2c; position: relative; }
  .screen { width: 100%; height: 100%; background: #1c1c1e; border-radius: 44px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 5; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 0; color: #fff; font-size: 15px; font-weight: 600; }
  .statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .content { padding: 18px 20px; flex: 1; overflow-y: auto; }
  .title { color: #fff; font-size: 30px; font-weight: 700; margin: 18px 4px 4px; }
  .subtitle { color: #8e8e93; font-size: 13px; margin: 0 4px 20px; }
  .field { background: #2c2c2e; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .field.row { display: flex; justify-content: space-between; align-items: center; }
  .field label { display: block; color: #8e8e93; font-size: 12px; margin-bottom: 4px; }
  .field.row label { margin: 0; color: #fff; font-size: 15px; }
  .field input, .field select { width: 100%; border: none; background: transparent; color: #fff; font-size: 16px; outline: none; font-family: inherit; }
  .field input::placeholder { color: #6c6c70; }
  .field select option { color: #000; }
  .switch { position: relative; display: inline-block; width: 51px; height: 31px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #39393d; border-radius: 31px; transition: .2s; }
  .slider:before { content: ""; position: absolute; height: 27px; width: 27px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #30d158; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .btn { margin-top: 8px; width: 100%; background: #0a84ff; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn:active { background: #0a6fd6; }
  .status { margin-top: 18px; background: #2c2c2e; border-radius: 12px; padding: 14px; color: #d1d1d6; font-size: 13px; line-height: 1.6; white-space: pre-wrap; min-height: 40px; }
  .hint { color: #6c6c70; font-size: 11px; text-align: center; padding: 12px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span id="clock">15:32</span>
        <span class="right">●●● 5G ▱ 100%</span>
      </div>
      <div class="content">
        <div class="title">RandomLauncher</div>
        <div class="subtitle">在指定时段内随机拉起 App</div>

        <div class="field">
          <label>开始时间</label>
          <input id="start" type="time" value="09:00">
        </div>
        <div class="field">
          <label>结束时间</label>
          <input id="end" type="time" value="21:00">
        </div>
        <div class="field row">
          <label>每天重复</label>
          <label class="switch"><input type="checkbox" id="repeat" checked><span class="slider"></span></label>
        </div>
        <div class="field row">
          <label>拉起后回到本 App</label>
          <label class="switch"><input type="checkbox" id="retself" checked><span class="slider"></span></label>
        </div>
        <div class="field">
          <label>停留秒数（仅“回到本 App”生效）</label>
          <input id="retsec" value="5" inputmode="numeric">
        </div>
        <div class="field">
          <label>触发次数</label>
          <input id="count" value="3" inputmode="numeric">
        </div>
        <div class="field">
          <label>目标 App</label>
          <select id="appsel" class="select">
            <option value="com.apple.MobileSafari">Safari</option>
            <option value="com.apple.Preferences">设置</option>
            <option value="com.tencent.xin">微信</option>
            <option value="com.ss.iphone.ugc.Aweme">抖音</option>
            <option value="com.apple.camera">相机</option>
            <option value="com.apple.mobileslideshow">照片</option>
          </select>
        </div>
        <div class="field">
          <label>目标 App Bundle ID</label>
          <input id="bundle" value="com.apple.MobileSafari">
        </div>

        <button class="btn" id="go">开始排程</button>
        <div class="status" id="status">填写时段与次数，点击「开始排程」预览触发时刻。</div>
      </div>
      <div class="hint">HTML 预览（非真机编译；实际 UI 由 Swift/UIKit 编译后在 iPhone 运行）</div>
    </div>
  </div>

<script>
  function parseTime(s){ const m = /^(\d{1,2}):(\d{2})$/.exec((s||'').trim()); if(!m) return null; const h=+m[1], mi=+m[2]; if(h<0||h>23||mi<0||mi>59) return null; const d=new Date(); d.setHours(h,mi,0,0); return d; }
  function pad(n){ return n<10?'0'+n:''+n; }
  document.getElementById('appsel').addEventListener('change', function(){ document.getElementById('bundle').value = this.value; });
  function updateRetSec(){ const on=document.getElementById('retself').checked; const r=document.getElementById('retsec'); r.disabled=!on; r.style.opacity=on?'1':'0.4'; }
  document.getElementById('retself').addEventListener('change', updateRetSec);
  updateRetSec();
  document.getElementById('go').addEventListener('click', function(){
    const start=parseTime(document.getElementById('start').value);
    const end=parseTime(document.getElementById('end').value);
    const count=parseInt(document.getElementById('count').value,10);
    const repeat=document.getElementById('repeat').checked;
    const retself=document.getElementById('retself').checked;
    const retsec=parseInt(document.getElementById('retsec').value,10)||5;
    let bundle=document.getElementById('bundle').value.trim()||'com.apple.MobileSafari';
    const st=document.getElementById('status');
    if(!start||!end||!(count>0)){ st.textContent='请填写正确的时间(HH:mm)与正整数次数'; return; }
    if(end<=start){ st.textContent='结束时间必须晚于开始时间'; return; }
    const span=end-start; const now=new Date(); let times=[];
    for(let i=0;i<count;i++){ const t=new Date(start.getTime()+Math.random()*span); if(t>now) times.push(t); }
    times.sort(function(a,b){return a-b;});
    if(times.length===0){ st.textContent='（今天该时段内已无可用时间）'; return; }
    const list=times.map(function(t){return pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds());}).join('\n');
    const repeatText = repeat ? '（每天重复，跨天自动重置）' : '（仅今日）';
    const retText = retself ? '\n拉起后约 '+retsec+' 秒自动回到本 App' : '';
    st.textContent='已排程 → '+bundle+' '+repeatText+'\n下次触发：\n'+list+retText;
  });
  setInterval(function(){ const d=new Date(); document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes()); }, 10000);
</script>
</body>
</html>
